name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # The suite runs on SQLite locally for speed; here it runs on real Postgres, which is
    # what catches the places where the two dialects disagree.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: padel
          POSTGRES_PASSWORD: padel
          POSTGRES_DB: padel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U padel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run ty check

      # No TEST_DATABASE_URL here on purpose: this run has to be the SQLite one.
      - name: Tests (SQLite)
        run: uv run pytest

      - name: Tests (Postgres)
        run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql://padel:padel@localhost:5432/padel_test

      - name: Migrations apply and roll back
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
        env:
          DATABASE_URL: postgresql://padel:padel@localhost:5432/padel_test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Types
        run: npm run check

      - name: Build
        run: npm run build
