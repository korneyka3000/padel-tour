# Run with `prek` (a drop-in, faster pre-commit): `uv run prek install`.
# `uv run prek run --all-files` checks the whole tree.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.69
    hooks:
      - id: ty

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      # Third-party licences are quoted verbatim or not at all — reformatting one is
      # editing somebody else's legal text.
      - id: end-of-file-fixer
        exclude: ^src/padel_tour/bot/assets/OFL\.txt$
      - id: trailing-whitespace
        exclude: ^src/padel_tour/bot/assets/OFL\.txt$
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        types: [python]

      # Both CI failures so far were things a commit hook could not see: a stale ruff
      # cache hiding an import-order change, and code that only breaks on Postgres. This
      # runs what CI runs, on the whole tree, with no cache — before anything leaves the
      # machine. `uv run prek install --hook-type pre-push` wires it up.
      - id: ci-parity
        name: full check (what CI runs)
        entry: uv run ruff check --no-cache .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: format-parity
        name: format check (what CI runs)
        entry: uv run ruff format --no-cache --check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: types-parity
        name: ty (what CI runs)
        entry: uv run ty check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
