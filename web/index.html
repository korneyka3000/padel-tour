<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#071A1F" />
    <title>Padel Tour</title>
    <meta
      name="description"
      content="Турниры по паделу: американо и мексикано, таблица и ход турнира по раундам."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Unbounded carries the big numbers; Golos Text does everything else. Both are
         Cyrillic-native rather than Latin faces with Cyrillic bolted on. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Golos+Text:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Telegram injects window.Telegram.WebApp when the page is opened as a Mini App.
         Loaded ahead of the bundle so the first render already knows where it is. Outside
         Telegram the object simply never appears, and the site behaves like a site. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
