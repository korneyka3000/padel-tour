[project]
name = "padel-tour"
version = "0.1.0"
description = "Padel tournament engine — Americano and Mexicano formats"
readme = "README.md"
requires-python = ">=3.14"
# The engine is a pure library and stays dependency-free. Anything a consumer needs — CLI,
# API, bot — lives in an optional group so importing the engine never drags it in.
dependencies = []

[project.optional-dependencies]
cli = [
    "typer>=0.15",
]
db = [
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
]
bot = [
    "aiogram>=3.15",
    "python-dotenv>=1.0",
]

[project.scripts]
padel-tour = "padel_tour.cli:app"
padel-tour-bot = "padel_tour.bot.app:main"

# A backend is needed so `uv sync` installs the project: the src/ layout makes
# `import padel_tour` resolvable and creates the `padel-tour` entry point.
# uv_build's default convention is src/<project name with dashes as underscores>,
# which is exactly this layout, so it needs no configuration.
[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.16",
    "ty>=0.0.65",
    "prek>=0.4",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",     # shadowed builtins
    "ANN",   # missing annotations
    "ARG",   # unused arguments
    "ASYNC", # async pitfalls — blocking calls in coroutines, unawaited work
    "B",     # bugbear
    "C4",    # comprehensions
    "C90",   # cyclomatic complexity
    "DTZ",   # naive datetimes
    "E",     # pycodestyle errors
    "ERA",   # commented-out code
    "F",     # pyflakes
    "FA",    # future annotations
    "FBT",   # boolean trap
    "FURB",  # refurb
    "G",     # logging format
    "I",     # import order
    "ISC",   # implicit string concatenation
    "LOG",   # logging misuse
    "N",     # naming
    "PERF",  # obvious inefficiencies
    "PIE",
    "PL",    # pylint
    "PT",    # pytest style
    "PTH",   # pathlib over os.path
    "RET",   # return flow
    "RSE",   # raise
    "RUF",
    "S",     # security (bandit)
    "SIM",   # simplify
    "SLF",   # private member access
    "T20",   # stray print
    "TC",    # type-checking-only imports
    "TID",   # tidy imports
    "TRY",   # exception antipatterns
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
ignore = [
    # Error messages carry maths notation (−, ×, ∪) and docs mix scripts, so the
    # ambiguous-unicode checks only ever fire on intentional characters.
    "RUF001",
    "RUF002",
    "RUF003",
    # Single-line implicit concatenation is what the formatter produces; leaving this on
    # makes lint and format disagree.
    "ISC001",
    # Wants exception messages baked into the exception class. Ours are contextual — they
    # name the round, the court, the score that was wrong — and end up in front of a human.
    # Templating them into class bodies would make them worse, not better.
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy resolves `Mapped[...]` annotations at runtime when it maps a class, so the
# types they name must be real imports. TC would helpfully move them into a TYPE_CHECKING
# block and every model would fail to map.
"src/padel_tour/db/models.py" = ["TC001", "TC002", "TC003"]
# Autogenerated by Alembic. Hand-wrapping generated DDL just means the next autogenerate
# produces a diff against our reformatting rather than against the schema.
"migrations/versions/*" = ["E501", "W291", "TC001", "TC002", "TC003", "INP001"]
"migrations/env.py" = ["TC001", "TC002", "TC003", "INP001"]
# Draws are reproducible on purpose: `random.Random(seed)` is the design, and a
# cryptographic generator would defeat it. Anything security-shaped added later (share
# tokens, invite links) lives outside these paths and stays checked.
"src/padel_tour/engine/*" = ["S311"]
"src/padel_tour/cli.py" = ["S311"]
"tests/**" = [
    "S101",    # asserts are the point of a test
    "S311",    # see above
    "PLR2004", # expected values are magic numbers on purpose
    "SLF001",  # tests may reach into internals
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.pylint]
# Recording a score genuinely needs six: session, tournament, round, court and two scores.
# They are keyword-only, so the call site stays readable and round/court cannot be swapped
# by accident — which is the mistake PLR0913 is really guarding against.
max-args = 6

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
# The engine is fully annotated; keep it that way.
possibly-unresolved-reference = "error"
